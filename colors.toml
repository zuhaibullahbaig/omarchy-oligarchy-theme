# Oligarchy
#
# Design rules. Nothing in this file breaks them.
#
#   1. ONE LIGHT SOURCE. Every gradient runs 135deg: light from upper left,
#      falling to shadow lower right. The wallpaper is lit the same way.
#   2. GOLD IS RARE. Champagne appears on focus and selection only. Every
#      other surface is neutral. Luxury is contrast, not saturation.
#   3. THE RAMP IS MONOTONIC. darker -> dark -> base -> lighter reads
#      strictly darkest to lightest, so depth is never ambiguous.
#   4. NEUTRALS ARE WARM. Every grey carries a few degrees of warmth so it
#      sits with the gold instead of fighting it. No clinical blue-grey.
#   5. THE TERMINAL BELONGS TO THE SAME OBJECT. Its colors are lifted for
#      legibility, not swapped for primaries. Nothing in the terminal is
#      brighter or cooler than the chrome around it can live with.

mode = "dark"

# ---------------------------------------------------------------- semantics

# Champagne. Focus rings, selection edges, the active window border.
accent = "#d9b779"

# Selection sits in the neutral ramp, warmed toward the accent. It reads as
# gold-lit charcoal, not as a gold block.
selection = "#2a2419"

# Comments, placeholders, dividers, disabled states.
muted = "#4a4f57"

# --------------------------------------------------------------- backgrounds

darker_background  = "#08090a"   # deepest wells: lock screen, OSD backing
dark_background    = "#0d0f11"   # bar, popups, chrome
background         = "#121417"   # primary surface
lighter_background = "#1a1d21"   # raised cards, hovered rows

# --------------------------------------------------------------- foregrounds

dark_foreground   = "#6b7280"   # de-emphasized labels
foreground        = "#c9ccd1"   # primary text
light_foreground  = "#dfe2e6"   # emphasized text
bright_foreground = "#f4f2ee"   # cursors, headings. Warm white, not #fff.

# -------------------------------------------------------------- named colors

# Terminal and syntax palette. Lacquer and patina tones rather than
# primaries — lifted just far enough to carry ls output, syntax
# highlighting, diffs and btop gauges, and no further. Everything here is
# warm-biased so the terminal reads as part of the same machine as the bar
# and the menu.

red     = "#d1603f"
green   = "#9fb56a"
yellow  = "#e8c274"
blue    = "#7d9ec4"
magenta = "#c08fa8"
cyan    = "#7fbdb2"
urgent  = "#e0724d"

color0  = "#1a1d21"
color1  = "#d1603f"
color2  = "#9fb56a"
color3  = "#e8c274"
color4  = "#7d9ec4"
color5  = "#c08fa8"
color6  = "#7fbdb2"
color7  = "#c9ccd1"

# color8 sits a little above `muted` so comments stay readable without
# lightening the shell's dividers and placeholders.
color8  = "#6b7280"
color9  = "#e07a58"
color10 = "#b8cc82"
color11 = "#f2d590"
color12 = "#96b4d6"
color13 = "#d3a6bb"
color14 = "#96cfc6"
color15 = "#f4f2ee"

# ------------------------------------------------------------------ borders

# Both stops struck at 135deg, matching the wallpaper's light. The bright
# stop is the lit upper edge; the dark stop is the metal turning away.
hyprland_active_border   = "rgba(e6cd9aee) rgba(a8813fee) 135deg"
hyprland_inactive_border = "rgba(23262aaa)"
