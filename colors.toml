# Oligarchy
#
# Design rules. Nothing in this file breaks them.
#
#   1. ONE LIGHT SOURCE. Every gradient runs 135deg: light from upper left,
#      falling to shadow lower right. The wallpaper is lit the same way.
#   2. GOLD IS THE CHROME, NOT THE PAINT. Champagne carries focus and
#      selection in the shell. It is not sprayed across every surface.
#   3. THE TERMINAL IS THE LOUD ROOM. Shell chrome stays quiet so the
#      terminal can be vivid. Syntax, ls, diffs and btop gauges need real
#      chroma to work, and they get it.
#   4. THE RAMP IS MONOTONIC. darker -> dark -> base -> lighter reads
#      strictly darkest to lightest, so depth is never ambiguous.
#   5. NEUTRALS ARE WARM. Every grey carries a few degrees of warmth so it
#      sits with the gold instead of fighting it.

mode = "dark"

# ---------------------------------------------------------------- semantics

# Champagne, at full strength. Focus rings, selection, active borders.
accent = "#f0c463"

# Selection: gold-lit charcoal, warm enough to read as the same material as
# the accent without becoming a gold block.
selection = "#33291a"

# Comments, placeholders, dividers, disabled states. Also ANSI color8. Kept
# light enough that comments are actually readable.
muted = "#5a616b"

# --------------------------------------------------------------- backgrounds

# Deeper and higher-contrast than a typical charcoal, so the vivid terminal
# colors below have somewhere to sit and stay sharp.

darker_background  = "#07080a"   # deepest wells: lock screen, OSD backing
dark_background    = "#0b0d10"   # bar, popups, chrome
background         = "#0f1114"   # primary surface
lighter_background = "#171a1e"   # raised cards, hovered rows

# --------------------------------------------------------------- foregrounds

dark_foreground   = "#78808c"   # de-emphasized labels
foreground        = "#d6d9de"   # primary text
light_foreground  = "#e8eaee"   # emphasized text
bright_foreground = "#fbf9f5"   # cursors, headings. Warm white, not #fff.

# -------------------------------------------------------------- named colors

# The terminal and syntax palette. High chroma, warm-biased, tuned for
# contrast against #0f1114. These carry ls output, syntax highlighting, diff
# markers, and btop gauges — they are working colors, not decoration.

red     = "#ff6b52"
green   = "#b8d15e"
yellow  = "#f0c463"
blue    = "#6fb0f0"
magenta = "#e08ac0"
cyan    = "#5fd4c4"
urgent  = "#ff6b52"

color0  = "#171a1e"
color1  = "#ff6b52"
color2  = "#b8d15e"
color3  = "#f0c463"
color4  = "#6fb0f0"
color5  = "#e08ac0"
color6  = "#5fd4c4"
color7  = "#d6d9de"

color8  = "#5a616b"
color9  = "#ff8a72"
color10 = "#cfe57a"
color11 = "#ffd97a"
color12 = "#92c8ff"
color13 = "#f5a8d8"
color14 = "#7fe8da"
color15 = "#fbf9f5"

# ------------------------------------------------------------------ borders

# Both stops struck at 135deg, matching the wallpaper's light. The bright
# stop is the lit upper edge; the dark stop is the metal turning away.
hyprland_active_border   = "rgba(ffd98fee) rgba(b8863cee) 135deg"
hyprland_inactive_border = "rgba(1c1f24aa)"
